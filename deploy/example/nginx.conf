# Example: serve web/ from nginx and proxy the API to the probe on another machine.
# The probe streams /api/trace as server-sent events, so buffering must be off.
location /anatomy/ {
    alias /var/www/anatomy-of-a-token/web/;
    try_files $uri $uri/ /anatomy/index.html;
}

location /anatomy/api/ {
    proxy_pass http://MODEL-HOST:1239/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 16k;
}
